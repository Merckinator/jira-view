name = "jira_view"
version = "0.1.0"
description = "A local, single-user front-end for Jira Cloud, with personal views and ordering"
licences = ["MIT"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_json = ">= 2.3.0 and < 4.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
shared = { path = "./shared" }
sqlight = ">= 1.2.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
