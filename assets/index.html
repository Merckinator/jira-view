<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jira-view</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (() => {
        try {
          const theme = localStorage.getItem("jv-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --jv-flag-row: rgba(192, 57, 43, 0.18);
        --jv-flag-row-hover: rgba(192, 57, 43, 0.26);
        --jv-flag-row-focus: rgba(192, 57, 43, 0.22);
        --jv-flag-top: rgba(192, 57, 43, 0.34);
        --jv-flag-mid: rgba(192, 57, 43, 0.18);
        --jv-flag-low: rgba(192, 57, 43, 0.06);
      }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --jv-flag-row: rgba(255, 90, 80, 0.18);
          --jv-flag-row-hover: rgba(255, 90, 80, 0.26);
          --jv-flag-row-focus: rgba(255, 90, 80, 0.22);
          --jv-flag-top: rgba(255, 90, 80, 0.34);
          --jv-flag-mid: rgba(255, 90, 80, 0.18);
          --jv-flag-low: rgba(255, 90, 80, 0.06);
        }
      }
      :root[data-theme="dark"] {
        --jv-flag-row: rgba(255, 90, 80, 0.18);
        --jv-flag-row-hover: rgba(255, 90, 80, 0.26);
        --jv-flag-row-focus: rgba(255, 90, 80, 0.22);
        --jv-flag-top: rgba(255, 90, 80, 0.34);
        --jv-flag-mid: rgba(255, 90, 80, 0.18);
        --jv-flag-low: rgba(255, 90, 80, 0.06);
      }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
      }
      .jv {
        max-width: 60rem; margin: 0 auto;
        padding: 1rem 1rem 4.5rem;
      }
      .jv-toolbar {
        display: flex; align-items: center; gap: 1rem;
        justify-content: space-between; margin-bottom: 0.75rem;
      }
      .jv-title { font-size: 1.1rem; margin: 0; }
      .jv-jql { display: flex; gap: 0.5rem; flex: 1; }
      .jv-jql-input {
        flex: 1; padding: 0.4rem 0.5rem;
        border: 1px solid #8884; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.8rem;
      }
      button { cursor: pointer; }
      .jv-table { width: 100%; border-collapse: collapse; }
      .jv-table:focus-visible {
        outline: 2px solid #8886; outline-offset: 2px; border-radius: 4px;
      }
      .jv-table th, .jv-table td {
        text-align: left; padding: 0.35rem 0.5rem;
        border-bottom: 1px solid #8883;
      }
      .jv-table th { font-weight: 600; color: #888; }
      .jv-row { cursor: pointer; }
      .jv-row:hover { background: #8882; }
      .jv-row-focused {
        outline: 1px solid #8886; outline-offset: -1px;
        background: #8881;
      }
      .jv-row-flagged { background: var(--jv-flag-row); }
      .jv-row-flagged:hover { background: var(--jv-flag-row-hover); }
      .jv-row-flagged.jv-row-focused {
        background: var(--jv-flag-row-focus);
      }
      /* drag handle column (⋮⋮) */
      .jv-table .jv-col-grab { width: 1.5rem; }
      .jv-grab {
        cursor: grab;
        color: #8885; user-select: none;
        font-size: 0.75rem; letter-spacing: -0.18em;
      }
      .jv-grab:active { cursor: grabbing; }
      .jv-tbody tr.sortable-ghost { opacity: 0.35; }
      .jv-tbody tr.sortable-chosen { background: #8882; }
      /* failed order saves */
      .jv-order-error { color: #c0392b; font-size: 0.8rem; margin: 0.25rem 0; }
      .jv-note, .jv-error, .jv-detail-meta { color: #888; }
      .jv-error { color: #c0392b; }
      .jv-detail {
        border: 1px solid #8884; border-radius: 8px;
        padding: 0.75rem 1rem; margin-bottom: 1rem; position: relative;
        overflow: hidden;
      }
      .jv-detail-top {
        margin: -0.75rem -1rem 0;
        padding: 0.75rem 1rem;
        border-radius: 8px 8px 0 0;
      }
      .jv-detail-top-flagged {
        background: linear-gradient(
          to bottom,
          var(--jv-flag-top) 0%,
          var(--jv-flag-mid) 45%,
          var(--jv-flag-low) 80%,
          transparent 100%
        );
      }
      .jv-detail-head {
        display: flex; justify-content: space-between; gap: 1rem;
      }
      .jv-detail-head-text { min-width: 0; flex: 1; }
      .jv-detail-head h2 { font-size: 1rem; margin: 0 0 0.25rem; }
      .jv-detail-head-actions {
        display: flex; gap: 0.4rem; align-items: flex-start; flex-wrap: wrap;
        justify-content: flex-end; flex: 0 0 auto;
      }
      .jv-summary-input {
        width: 100%; box-sizing: border-box; margin: 0 0 0.25rem;
        padding: 0.25rem 0.4rem; font-size: 1rem; font-weight: 600;
        border: 1px solid #8884; border-radius: 6px;
      }
      .jv-summary-edit, .jv-summary-save, .jv-summary-cancel {
        font-size: 0.8rem; padding: 0.2rem 0.6rem;
      }
      .jv-open-jira {
        font-size: 0.8rem; padding: 0.2rem 0.2rem;
        color: #06c; text-decoration: none; white-space: nowrap;
      }
      .jv-open-jira:hover { text-decoration: underline; }
      .jv-detail-meta { margin: 0; }
      .jv-detail-flag {
        display: inline-flex; align-items: center; gap: 0.35rem;
        margin: 0.4rem 0 0.5rem; font-size: 0.85rem; color: #888;
      }
      .jv-detail-assignee {
        display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
        margin: 0.4rem 0 0.5rem; font-size: 0.85rem;
      }
      .jv-assignee-current { display: inline-flex; align-items: center; }
      .jv-assignee-select {
        padding: 0.18rem 0.35rem; font-size: 0.8rem; max-width: 16rem;
        border: 1px solid #8884; border-radius: 6px; background: none;
      }
      .jv-close {
        border: 0; background: none; font-size: 0.9rem; color: #888;
      }
      .jv-close:hover { color: currentColor; }
      .jv-adf ul, .jv-adf ol { padding-left: 1.2rem; }
      .jv-adf h3 {
        font-size: 0.9rem; margin: 0.6rem 0 0.3rem;
        text-transform: none; letter-spacing: 0;
      }
      /* write panel (Phase 4) */
      .jv-transitions {
        display: flex; gap: 0.4rem; flex-wrap: wrap;
        margin: 0.4rem 0 0.6rem;
      }
      .jv-transition {
        padding: 0.18rem 0.55rem; font-size: 0.8rem;
        border: 1px solid #8884; border-radius: 6px; background: none;
      }
      .jv-transition:hover { background: #8882; }
      /* labels */
      .jv-labels {
        display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.2rem;
      }
      .jv-label {
        display: inline-flex; align-items: center; gap: 0.15rem;
        font-size: 0.7rem; line-height: 1.2; padding: 0.05rem 0.4rem;
        border-radius: 999px; background: #8882; white-space: nowrap;
      }
      .jv-label-remove {
        border: 0; background: none; padding: 0; color: #888;
        font-size: 0.75rem; line-height: 1;
      }
      .jv-label-remove:hover { color: #c0392b; }
      .jv-labels-section { margin: 0.35rem 0 0.5rem; }
      .jv-labels-row { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
      .jv-labels-row .jv-labels { margin-top: 0; }
      .jv-label-form { display: flex; gap: 0.35rem; margin-top: 0.35rem; }
      .jv-label-input {
        width: 11rem; padding: 0.2rem 0.4rem;
        border: 1px solid #8884; border-radius: 6px; font-size: 0.8rem;
      }
      .jv-label-add { font-size: 0.8rem; padding: 0.2rem 0.55rem; }
      .jv-section-title {
        font-size: 0.8rem; margin: 0.9rem 0 0.3rem; color: #888;
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      }
      .jv-comment, .jv-worklog { padding: 0.45rem 0; border-bottom: 1px dashed #8882; }
      .jv-comment:last-of-type, .jv-worklog:last-of-type { border-bottom: 0; }
      .jv-comment-meta { font-size: 0.75rem; color: #888; margin-bottom: 0.2rem; }
      .jv-pending { opacity: 0.55; font-style: italic; }
      .jv-actions { margin-top: 0.4rem; display: flex; gap: 0.5rem; }
      .jv-comment-input {
        width: 100%; box-sizing: border-box; min-height: 3.2rem;
        padding: 0.4rem 0.5rem; margin-top: 0.5rem;
        border: 1px solid #8884; border-radius: 6px;
        font-family: inherit; font-size: 0.85rem; resize: vertical;
      }
      .jv-comment-hint { margin: 0.25rem 0 0; font-size: 0.72rem; }
      .jv-worklog-input {
        flex: 1; padding: 0.3rem 0.5rem;
        border: 1px solid #8884; border-radius: 6px; font-size: 0.8rem;
      }
      .jv-write-error { color: #c0392b; font-size: 0.8rem; margin: 0.25rem 0; }
      /* saved views (Phase 5) */
      .jv-toolbar { flex-wrap: wrap; }
      .jv-view-select {
        padding: 0.35rem 0.4rem; border: 1px solid #8884; border-radius: 6px;
        font-size: 0.9rem; flex: 0 0 auto; max-width: 14rem;
      }
      .jv-board-note { color: #888; font-size: 0.8rem; flex: 1; }
      .jv-edit-view, .jv-new-view {
        font-size: 0.8rem; padding: 0.3rem 0.6rem;
      }
      .jv-edit {
        border: 1px dashed #8886; border-radius: 8px; padding: 0.6rem;
        display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem;
      }
      .jv-edit-row { display: flex; gap: 0.5rem; }
      .jv-edit-name {
        flex: 1; padding: 0.3rem 0.5rem;
        border: 1px solid #8884; border-radius: 6px;
      }
      .jv-edit-jql {
        flex: 1; padding: 0.3rem 0.5rem; border: 1px solid #8884; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.8rem;
      }
      .jv-edit-board { flex: 1; padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid #8884; }
      .jv-src-toggle { display: flex; gap: 0.25rem; }
      .jv-src {
        padding: 0.3rem 0.6rem; font-size: 0.8rem;
        border: 1px solid #8884; border-radius: 6px; background: none;
      }
      .jv-src.jv-active { background: #8883; font-weight: 600; }
      .jv-edit-columns {
        display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;
        font-size: 0.8rem; color: #888;
      }
      .jv-edit-columns label { display: inline-flex; gap: 0.25rem; align-items: center; }
      .jv-edit-actions { display: flex; gap: 0.5rem; }
      .jv-save-view, .jv-cancel-edit { font-size: 0.8rem; padding: 0.3rem 0.7rem; }
      .jv-delete { color: #c0392b; font-size: 0.8rem; padding: 0.3rem 0.7rem; }
      .jv-avatar {
        width: 1.2rem; height: 1.2rem; border-radius: 50%;
        vertical-align: -0.3em; margin-right: 0.3rem;
      }
      .jv-attachment { margin: 0.3rem 0; }
      .jv-attachment-image {
        display: block; max-width: 240px; max-height: 180px;
        border: 1px solid #8883; border-radius: 4px;
      }
      .jv-attachment a { color: #06c; }

      /* floating appearance palette */
      .jv-theme-trigger {
        position: fixed;
        right: max(1rem, calc((100vw - 60rem) / 2 + 1rem));
        bottom: 1.25rem;
        z-index: 30;
        display: inline-flex; align-items: center; gap: 0.45rem;
        padding: 0.5rem 0.8rem 0.5rem 0.7rem;
        border: 1px solid #8884;
        border-radius: 999px;
        background: Canvas;
        background: color-mix(in srgb, Canvas 82%, transparent);
        color: CanvasText;
        box-shadow: 0 8px 24px #0002;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        font: inherit; font-size: 0.8rem; font-weight: 600;
      }
      .jv-theme-trigger:hover {
        background: Canvas;
        background: color-mix(in srgb, Canvas 92%, transparent);
        border-color: #8887;
      }
      .jv-theme-trigger:focus-visible {
        outline: 2px solid #8887; outline-offset: 2px;
      }
      .jv-theme-trigger .jv-theme-icon {
        width: 1.05rem; height: 1.05rem;
      }
      .jv-theme-trigger-label { line-height: 1; }

      .jv-theme-dialog {
        position: fixed; inset: 0;
        width: 100%; height: 100%; height: 100dvh;
        max-width: none; max-height: none;
        margin: 0; padding: 0; border: 0;
        background: transparent; color: inherit;
        overflow: hidden;
      }
      .jv-theme-dialog::backdrop { background: transparent; }
      .jv-theme-dialog[open] {
        display: flex; align-items: center; justify-content: center;
      }
      body:has(.jv-theme-dialog[open]) { overflow: hidden; }
      .jv-theme-backdrop {
        position: absolute; inset: 0;
        background: rgba(20, 18, 17, 0.32);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        animation: jv-theme-fade 140ms ease-out;
      }
      .jv-theme-panel {
        position: relative;
        width: min(27rem, calc(100vw - 2rem));
        max-height: calc(100vh - 2rem);
        max-height: calc(100dvh - 2rem);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 1rem;
        border: 1px solid #8885;
        border-radius: 16px;
        background: Canvas;
        background: color-mix(in srgb, Canvas 94%, transparent);
        color: CanvasText;
        box-shadow: 0 24px 80px #0005;
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        animation: jv-theme-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .jv-theme-head {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 1rem; margin-bottom: 0.85rem;
      }
      .jv-theme-title {
        margin: 0; font-size: 1.05rem; letter-spacing: -0.01em;
      }
      .jv-theme-subtitle {
        margin: 0.2rem 0 0; color: #888; font-size: 0.78rem;
      }
      .jv-theme-head-actions { display: flex; gap: 0.35rem; }
      .jv-theme-cycle, .jv-theme-close {
        width: 1.8rem; height: 1.8rem; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid transparent; border-radius: 8px;
        background: transparent; color: inherit;
        font: inherit; font-size: 1.05rem; line-height: 1;
      }
      .jv-theme-cycle:hover, .jv-theme-close:hover {
        background: #8882; border-color: #8884;
      }
      .jv-theme-cycle:focus-visible, .jv-theme-close:focus-visible {
        outline: 2px solid #8887; outline-offset: 1px;
      }
      .jv-theme-options {
        display: flex; flex-direction: column; gap: 0.35rem;
      }
      .jv-theme-option {
        display: flex; align-items: center; gap: 0.75rem;
        width: 100%; padding: 0.55rem 0.6rem;
        border: 1px solid transparent; border-radius: 12px;
        background: transparent; color: inherit;
        font: inherit; text-align: left;
      }
      .jv-theme-option:hover {
        background: #8881; border-color: #8883;
      }
      .jv-theme-option[aria-pressed="true"] {
        background: #8882; border-color: #8885;
      }
      .jv-theme-option:focus-visible {
        outline: 2px solid #8887; outline-offset: 1px;
      }
      .jv-theme-swatch {
        width: 2.7rem; height: 1.9rem; flex: 0 0 auto;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid #8885; border-radius: 8px;
        overflow: hidden;
      }
      .jv-theme-swatch .jv-theme-icon {
        width: 0.95rem; height: 0.95rem; opacity: 0.85;
      }
      .jv-theme-swatch-light {
        background: linear-gradient(to bottom, #fff 0 35%, #f2efec 35% 100%);
        color: #4a4642;
      }
      .jv-theme-swatch-dark {
        background: linear-gradient(to bottom, #2b2927 0 35%, #1b1a19 35% 100%);
        color: #e8e3de;
      }
      .jv-theme-swatch-auto {
        background: linear-gradient(90deg, #fff 0 50%, #1b1a19 50% 100%);
        color: #888;
      }
      .jv-theme-option-copy {
        display: flex; flex-direction: column; gap: 0.1rem;
        flex: 1; min-width: 0;
      }
      .jv-theme-option-label {
        font-size: 0.86rem; font-weight: 600;
      }
      .jv-theme-option-desc {
        color: #888; font-size: 0.75rem;
      }
      .jv-theme-check {
        width: 1.2rem; text-align: center;
        color: #3c9d6a; font-weight: 700;
      }
      .jv-theme-foot {
        display: flex; align-items: center; justify-content: space-between;
        gap: 0.5rem; flex-wrap: wrap;
        margin-top: 0.8rem; padding-top: 0.7rem;
        border-top: 1px solid #8883;
        color: #888; font-size: 0.7rem;
      }
      .jv-theme-hint {
        display: inline-flex; align-items: center; gap: 0.25rem;
      }
      .jv-theme-kbd {
        padding: 0.1rem 0.3rem;
        border: 1px solid #8884; border-bottom-width: 2px;
        border-radius: 4px; background: #8881;
        font-family: ui-monospace, monospace; font-size: 0.65rem;
      }
      @keyframes jv-theme-in {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes jv-theme-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (max-width: 40rem) {
        .jv-theme-trigger {
          right: 0.75rem; bottom: 0.75rem; padding: 0.55rem;
        }
        .jv-theme-trigger-label { display: none; }
        .jv-theme-panel {
          width: calc(100vw - 1.5rem);
          max-height: calc(100dvh - 1.5rem);
        }
        .jv-theme-option { padding: 0.5rem; gap: 0.6rem; }
        .jv-theme-swatch { width: 2.4rem; height: 1.75rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .jv-theme-backdrop, .jv-theme-panel { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "/assets/app.js"
      main()
    </script>
  </body>
</html>
