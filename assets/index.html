<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jira-view</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
      }
      .jv { max-width: 60rem; margin: 0 auto; padding: 1rem; }
      .jv-toolbar {
        display: flex; align-items: center; gap: 1rem;
        justify-content: space-between; margin-bottom: 0.75rem;
      }
      .jv-title { font-size: 1.1rem; margin: 0; }
      .jv-jql { display: flex; gap: 0.5rem; flex: 1; }
      .jv-jql-input {
        flex: 1; padding: 0.4rem 0.5rem;
        border: 1px solid #8884; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.8rem;
      }
      button { cursor: pointer; }
      .jv-table { width: 100%; border-collapse: collapse; }
      .jv-table th, .jv-table td {
        text-align: left; padding: 0.35rem 0.5rem;
        border-bottom: 1px solid #8883;
      }
      .jv-table th { font-weight: 600; color: #888; }
      .jv-row { cursor: pointer; }
      .jv-row:hover { background: #8882; }
      .jv-row-focused {
        outline: 1px solid #8886; outline-offset: -1px;
        background: #8881;
      }
      /* drag handle column (⋮⋮) */
      .jv-table .jv-col-grab { width: 1.5rem; }
      .jv-grab {
        cursor: grab;
        color: #8885; user-select: none;
        font-size: 0.75rem; letter-spacing: -0.18em;
      }
      .jv-grab:active { cursor: grabbing; }
      .jv-tbody tr.sortable-ghost { opacity: 0.35; }
      .jv-tbody tr.sortable-chosen { background: #8882; }
      /* failed order saves */
      .jv-order-error { color: #c0392b; font-size: 0.8rem; margin: 0.25rem 0; }
      .jv-note, .jv-error, .jv-detail-meta { color: #888; }
      .jv-error { color: #c0392b; }
      .jv-detail {
        border: 1px solid #8884; border-radius: 8px;
        padding: 0.75rem 1rem; margin-bottom: 1rem; position: relative;
      }
      .jv-detail-head { display: flex; justify-content: space-between; gap: 1rem; }
      .jv-detail-head h2 { font-size: 1rem; margin: 0.25rem 0 0.5rem; }
      .jv-close {
        border: 0; background: none; font-size: 0.9rem; color: #888;
      }
      .jv-close:hover { color: currentColor; }
      .jv-adf ul { padding-left: 1.2rem; }
      /* write panel (Phase 4) */
      .jv-transitions {
        display: flex; gap: 0.4rem; flex-wrap: wrap;
        margin: 0.4rem 0 0.6rem;
      }
      .jv-transition {
        padding: 0.18rem 0.55rem; font-size: 0.8rem;
        border: 1px solid #8884; border-radius: 6px; background: none;
      }
      .jv-transition:hover { background: #8882; }
      .jv-section-title {
        font-size: 0.8rem; margin: 0.9rem 0 0.3rem; color: #888;
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      }
      .jv-comment, .jv-worklog { padding: 0.45rem 0; border-bottom: 1px dashed #8882; }
      .jv-comment:last-of-type, .jv-worklog:last-of-type { border-bottom: 0; }
      .jv-comment-meta { font-size: 0.75rem; color: #888; margin-bottom: 0.2rem; }
      .jv-pending { opacity: 0.55; font-style: italic; }
      .jv-actions { margin-top: 0.4rem; display: flex; gap: 0.5rem; }
      .jv-comment-input {
        width: 100%; box-sizing: border-box; min-height: 3.2rem;
        padding: 0.4rem 0.5rem; margin-top: 0.5rem;
        border: 1px solid #8884; border-radius: 6px;
        font-family: inherit; font-size: 0.85rem; resize: vertical;
      }
      .jv-worklog-input {
        flex: 1; padding: 0.3rem 0.5rem;
        border: 1px solid #8884; border-radius: 6px; font-size: 0.8rem;
      }
      .jv-write-error { color: #c0392b; font-size: 0.8rem; margin: 0.25rem 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { main } from "/assets/app.js"
      main()
    </script>
  </body>
</html>
